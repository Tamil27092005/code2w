[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "stocky-openenv"
version = "1.0.0"
description = "Indian Stock Market Multi-Agent Recommendation Environment (OpenEnv Spec)"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "Scaler Hackathon Submission" }
]
keywords = ["openenv", "finance", "stock-market", "multi-agent", "india", "NSE"]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
live = [
    "groq",
    "finnhub-python",
]

[tool.setuptools.packages.find]
where = ["."]

[project.scripts]
stocky-openenv = "app:app"
